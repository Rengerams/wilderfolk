# Base44 sandbox environment for Wilderfolk (Vite + React + TypeScript client).
# The app is a client-only SPA; Tauri is only used for desktop packaging and is not
# part of this web preview. The dev server runs from the bind-mounted source so
# edits hot-reload without rebuilding an image.
services:
  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:5173"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      # Vite >= 6.1 appends this list to server.allowedHosts; the platform sets the value.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
    command:
      - sh
      - -ec
      - |
        npm ci --prefer-offline --no-audit --no-fund
        exec npx vite --host 0.0.0.0 --port 5173
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

volumes:
  node_modules:
