# Base44 sandbox development environment.
#
# Wilderfolk is a client-only React + Vite app (no backend, no database, no external service),
# so the sandbox runs a single service: the Vite dev server, started from the bind-mounted
# clone so every edit is live. The repo's own tooling targets Windows/PowerShell; this file is
# the Linux/sandbox runbook only and changes nothing about the app's build.
services:
  web:
    image: node:22
    working_dir: /app
    labels:
      base44.project: Wilderfolk
      base44.kind: web
      base44.port: 3000
    ports:
      - "3000:5173"
    environment:
      # Vite honours BROWSER=none; the config sets server.open = true, which has no browser here.
      - BROWSER=none
      # Platform-provided: lets Vite accept the preview proxy's hostname (Vite >= 6.1 appends it).
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
    volumes:
      - ./:/app
      # Dependencies live in a volume so the bind mount cannot shadow them; the install below
      # re-syncs from package-lock.json whenever the lockfile changes.
      - web_node_modules:/app/node_modules
    command:
      - sh
      - -ec
      - |
        if [ ! -f node_modules/.base44-install-stamp ] || ! cmp -s package-lock.json node_modules/.base44-install-stamp; then
          echo '[base44] installing dependencies from package-lock.json'
          npm ci --no-audit --no-fund
          cp package-lock.json node_modules/.base44-install-stamp
        fi
        exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    restart: on-failure
    healthcheck:
      # Dev server answers "/" plus the app's entry module, so the check fails on a broken transform too.
      test:
        - CMD
        - node
        - -e
        - |
          const urls = ['http://127.0.0.1:5173/', 'http://127.0.0.1:5173/src/main.tsx']
          Promise.all(urls.map((u) => fetch(u)))
            .then((rs) => process.exit(rs.every((r) => r.ok) ? 0 : 1))
            .catch(() => process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  web_node_modules:
