# Base44 sandbox runbook — runs the clone from source with Vite's dev server on host port 3000.
services:
  web:
    image: node:22
    working_dir: /app
    command:
      - sh
      - -ec
      - npm ci --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 3000 --strictPort --no-open
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      # Vite appends this to its dev-server host allowlist (preview proxy hostnames).
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 240s

volumes:
  node_modules:
