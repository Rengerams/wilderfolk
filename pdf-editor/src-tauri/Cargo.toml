[package]
name = "pdf-studio"
version = "0.2.0"
description = "PDF Studio — desktop PDF editor"
authors = ["Renger Vegting"]
license = "MIT"
edition = "2024"
rust-version = "1.99.1"

[lib]
name = "pdf_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-fs = "2.7.1"
tauri-plugin-dialog = "2.8.3"
signtool = "1.2.0"
msixbundle = "1.1.15"
