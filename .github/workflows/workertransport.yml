name: workertransport

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/game/**'
      - 'scripts/repro-worker-stall.mts'
      - 'scripts/worker-boundary-audit.mts'
      - 'tests/gameWorker*.test.ts'
      - 'tests/renderBufferPool*.test.ts'
      - 'tests/renderPacking*.test.ts'
      - 'tests/simDelta*.test.ts'
      - 'tests/simPrep*.test.ts'
      - 'tests/worker*.test.ts'
      - 'tests/*.worker*.test.ts'
      - '.github/workflows/workertransport.yml'
  push:
    branches: [main]
    paths:
      - 'src/game/**'
      - 'scripts/repro-worker-stall.mts'
      - 'scripts/worker-boundary-audit.mts'
      - 'tests/gameWorker*.test.ts'
      - 'tests/renderBufferPool*.test.ts'
      - 'tests/renderPacking*.test.ts'
      - 'tests/simDelta*.test.ts'
      - 'tests/simPrep*.test.ts'
      - 'tests/worker*.test.ts'
      - 'tests/*.worker*.test.ts'
      - '.github/workflows/workertransport.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-transport-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render-worker-stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
          cache: npm

      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Worker source and boundary regression tests
        run: >
          npx vitest run
          tests/gameWorker*.test.ts
          tests/worker*.test.ts
          tests/simDelta*.test.ts
          tests/simPrep*.test.ts
          tests/renderPacking*.test.ts
          tests/renderBufferPool*.test.ts
          tests/*.worker*.test.ts

      - name: Render worker 5000 ticks and 1000 command transfers
        env:
          TICKS: '5000'
          COMMANDS: '1000'
          PERF_MEASURE: '1'
          STALL_MS: '2500'
        run: node --expose-gc --import tsx scripts/repro-worker-stall.mts

      - name: Worker boundary field coverage
        run: npx tsx scripts/worker-boundary-audit.mts
