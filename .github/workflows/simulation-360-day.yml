name: 360-day simulation gate

# The standard gate stops at the unit tier, so its green tick says nothing about a full year of
# simulation. This separate workflow runs the real 360-day paths for changes that can move them.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      # Include simulation code; ordered exclusions skip presentation-only changes.
      # Mixed PRs still run if any non-excluded simulation file changes.
      - 'src/game/**'
      - '!src/game/*.tsx'
      - '!src/game/renderer/**'
      - '!src/game/renderer.ts'
      - '!src/game/canvasLayer.ts'
      - '!src/game/decorRender.ts'
      - '!src/game/entityLayer.ts'
      - '!src/game/terrainLayer.ts'
      - '!src/game/stripRender.ts'
      - '!src/game/entitySprites.ts'
      - '!src/game/humanSprites.ts'
      - '!src/game/spriteLoader.ts'
      - '!src/game/huntvisuals.ts'
      - '!src/game/introTimeline.ts'
      - '!src/game/renffrStar.ts'
      - '!src/game/villagePortrait.ts'
      - '!src/game/weatherVisualPreferences.ts'
      - '!src/game/buildingProgressDisplay.ts'
      - '!src/game/dashboardData.ts'
      - '!src/game/viewState.ts'
      - '!src/game/humanStatus.ts'
      - '!src/game/citizenOverview.ts'
      - '!src/game/rivalDisplay.ts'
      - '!src/game/focusHints.ts'
      - '!src/game/logisticsOverlayData.ts'
      - '!src/game/uiSimSummary.ts'
      - '!src/game/eventLogFilters.ts'
      - '!src/game/eventLogExport.ts'
      - scripts/run-full-year.mts
      - scripts/colonyHealth.ts
      - tests/fullYear.integration.test.ts
      - tests/longRunColony.integration.test.ts
      - .github/workflows/simulation-360-day.yml

permissions:
  contents: read

concurrency:
  group: simulation-360-day-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-year:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4.4.0

      - name: Use Node.js 26.12.1 (with npm cache)
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '26.12.1'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Full-year integration test (360 days through gameTick)
        run: npm run test:full-year:test

      - name: Seeded 360-day colony harness with invariant checkpoints
        run: npm run test:full-year
