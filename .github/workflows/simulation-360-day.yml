name: 360-day simulation gate

# The standard gate stops at the unit tier, so its green tick says nothing about a full year of
# simulation. This separate workflow runs the real 360-day paths for changes that can move them.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  
      # Include simulation code; ordered exclusions skip presentation-only changes.
      # Mixed PRs still run if any non-excluded simulation file changes.
      
run: npm ci --prefer-offline --no-audit --no-fund
run: npm run test:standard

permissions:
  contents: read

concurrency:
  cancel-in-progress: true

jobs:
  full-year:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4.4.0

      - name: Use Node.js 26.12.1 (with npm cache)
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '26.12.1'
          cache: npm

