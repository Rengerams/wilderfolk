name: Dead code audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dead-code-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knip:
    name: Knip (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: full-project
            args: ''
          - mode: production-only
            args: '--production'
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: '26.12.1'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Report unused files, exports, types and dependencies
        run: npm exec -- knip ${{ matrix.args }}
