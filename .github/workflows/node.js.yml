name: Node.js CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
# New commits supersede outdated runs of the same branch.
concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
      - name: Use Node.js 26.12.1 (with npm cache)
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '26.12.1'
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run PR checks and affected tests
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm test -- standard --changed "$PR_BASE_SHA" && npm run build
      - name: Run full checks on main
        if: github.event_name == 'push'
        run: |
          npm run test:standard
          npm run build
