name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Veranderd naar ubuntu-latest voor snellere builds (tenzij Windows vereist is)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.22.1]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    # Volgorde gecorrigeerd en npm install vervangen door npm ci
    - name: Install dependencies
      run: npm ci

    - name: Build source code
      run: npm run build --if-present

    - name: Run tests
      run: npm test
