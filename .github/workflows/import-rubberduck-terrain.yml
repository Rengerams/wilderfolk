name: Import selected CC0 rubberduck terrain textures
on:
  push:
    branches:
      - feat/biome-ecotone-transitions-20261028
    paths:
      - .github/workflows/import-rubberduck-terrain.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch exact artist archive and verify supplied user ZIP
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error --max-time 180             'https://opengameart.org/sites/default/files/50_free_textures_5.zip'             -o /tmp/50_free_textures_5.zip
          printf '%s  %s\n' '4b535f0e09a8bf4d62e81fe7b28cd099fe1586e74d0b5eede5ccc2f4fbde5b7a' '/tmp/50_free_textures_5.zip' | sha256sum --check
      - name: Import only the usable ground and structure albedos
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import io, zipfile
          selected = (
            201, 206, 209, 210, 215, 217, 218, 231,
            232, 233, 234, 235, 241, 246,
          )
          output = Path('public/sprites/terrain/rubberduck')
          output.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile('/tmp/50_free_textures_5.zip') as z:
              assert len(z.namelist()) == 100, 'Expected 50 albedos and 50 normal maps'
              for number in selected:
                  name = f'{number}.jpg'
                  src = Image.open(io.BytesIO(z.read(name))).convert('RGB')
                  assert src.size == (1024, 1024), f'{name}: unexpected source size'
                  src = src.resize((512, 512), Image.Resampling.LANCZOS)
                  src.save(output / name, 'JPEG', quality=88, optimize=True, subsampling=0)
          print(f'Imported {len(selected)} original-artist albedo variants; 50 normal maps and irrelevant materials excluded')
          PY
      - name: Commit locally served, reduced-resolution textures to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/sprites/terrain/rubberduck/
          if ! git diff --cached --quiet; then
            git commit -m 'assets(CC0): curate 14 rubberduck ground and material textures from verified pack'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
