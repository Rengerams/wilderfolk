name: Reusable population performance comparison

on:
  workflow_call:
    inputs:
      tier:
        required: true
        type: string
      population:
        required: true
        type: number

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PERF_POPS: ${{ inputs.population }}
      PERF_SEED: '12345'
      PERF_TICKS: '72'
      PERF_WARMUP: '12'
      SIM_FULL_SIM: '0'
      PERF_PROFILE: '0'
      PERF_ROUNDTRIP: '0'

    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '26.12.1'
          cache: npm

      - name: Select immutable commits and output directory
        shell: bash
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || 'main' }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          TIER: ${{ inputs.tier }}
        run: |
          set -euo pipefail
          echo "BASE_SHA=$(git rev-parse "$BASE_REVISION^{commit}")" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$(git rev-parse "$HEAD_REVISION^{commit}")" >> "$GITHUB_ENV"
          echo "REPORT_DIR=$RUNNER_TEMP/population-perf-$TIER" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/population-perf-$TIER"

      - name: Benchmark baseline commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_SHA"
          npm ci --prefer-offline --no-audit --no-fund
          PERF_REPORT="$REPORT_DIR/baseline.json" /usr/bin/time -f 'peak_rss_kib=%M\nelapsed_seconds=%e' -o "$REPORT_DIR/baseline.resources" \
            node --import tsx scripts/perf-at-pop.ts 2>&1 | tee "$REPORT_DIR/baseline.log"

      - name: Benchmark PR commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$HEAD_SHA"
          npm ci --prefer-offline --no-audit --no-fund
          PERF_REPORT="$REPORT_DIR/pr.json" /usr/bin/time -f 'peak_rss_kib=%M\nelapsed_seconds=%e' -o "$REPORT_DIR/pr.resources" \
            node --import tsx scripts/perf-at-pop.ts 2>&1 | tee "$REPORT_DIR/pr.log"

      - name: Validate measurements and publish comparison
        shell: bash
        run: |
          node scripts/compare-population-benchmarks.mjs \
            "$REPORT_DIR/baseline.json" "$REPORT_DIR/pr.json" "$PERF_POPS" \
            "$REPORT_DIR/baseline.resources" "$REPORT_DIR/pr.resources"

      - name: Upload raw benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: population-perf-${{ inputs.tier }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/population-perf-${{ inputs.tier }}/
          if-no-files-found: warn
          retention-days: 14
