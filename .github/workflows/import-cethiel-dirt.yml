name: Import Cethiel CC0 dirt albedos
on:
  push:
    branches: [feat/biome-ecotone-transitions-20261028]
    paths: [.github/workflows/import-cethiel-dirt.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download the creator's archive and verify the supplied originals
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error --max-time 150             'https://opengameart.org/sites/default/files/Tileable%20Dirt%20Textures.zip'             -o /tmp/dirt.zip
          mkdir -p public/sprites/terrain/cethiel
          for n in 01 02 03 04; do
            unzip -p /tmp/dirt.zip "Dirt_${n}.png" > "public/sprites/terrain/cethiel/Dirt_${n}.png"
          done
          cat > /tmp/dirt-sha256 <<'SUMS'
          5fc12517a5ae3bcf8ddbb14cb60961db6778d5577a83cd0d83685b7a695356ac  public/sprites/terrain/cethiel/Dirt_01.png
          80ce292cd0c9f131d7f995c41f8d135b827fbc721daef8bbf07e0b986988b32f  public/sprites/terrain/cethiel/Dirt_02.png
          dcac299d389c05088d97c4454a1ec65c40428f3f2badf1f1aa3a9fa36d41d2e1  public/sprites/terrain/cethiel/Dirt_03.png
          9ddef93734e1fdb479ac3b0b5b8e95cd1aa37b4d64b02868e246bdf2ba4a81b7  public/sprites/terrain/cethiel/Dirt_04.png
          SUMS
          sha256sum --check /tmp/dirt-sha256
      - name: Commit four verified 512px albedos (normal maps excluded)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/sprites/terrain/cethiel/Dirt_0*.png
          if ! git diff --cached --quiet; then
            git commit -m 'assets(CC0): import exact Cethiel Dirt_01–04 from user ZIP'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
