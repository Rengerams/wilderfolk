name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main, 'fix/**', 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source checks, tests, and build
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.12.0'
          # We zetten de automatische setup-node cache uit om de Windows/Node 26 bug te omzeilen
          cache: '' 

      # We gebruiken de stabiele actions/cache om de npm-cache map handmatig vast te leggen
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: C:\npm\cache
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install locked dependencies
        id: install
        run: npm ci

      - name: Source, docs, and comment checks
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:source
        
      - name: Typecheck tests
        if: ${{ always() && !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:standard
      
      - name: Build production bundle
        run: npm run build
