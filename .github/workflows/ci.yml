name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main, 'fix/**', 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source checks, tests, and build
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.12.0' # Pas dit aan naar jouw gewenste LTS-versie (bijv. 20 of 22)
          cache: 'npm'

      - name: Install locked dependencies
        id: install
        run: npm ci

      - name: Source, docs, and comment checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:source
        
      - name: Typecheck tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:standard

      - name: Build production bundle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
