name: Vendor CC0 RPG road and wall art
on:
  push:
    branches: [feature/roads-walls-navigation-overhaul]
    paths: [.github/workflows/vendor-oga-pr59.yml]
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download original CC0 source assets and commit them
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/sprites/oga_drummyfish
          curl -fLsS --retry 3 --max-time 45 https://opengameart.org/sites/default/files/tile_pavement.png -o public/sprites/oga_drummyfish/tile_pavement.png
          curl -fLsS --retry 3 --max-time 45 https://opengameart.org/sites/default/files/wall_4.png -o public/sprites/oga_drummyfish/wall.png
          curl -fLsS --retry 3 --max-time 45 https://opengameart.org/sites/default/files/gate_1.png -o public/sprites/oga_drummyfish/gate.png
          for png in public/sprites/oga_drummyfish/*.png; do
            test "$(file -b --mime-type "$png")" = "image/png"
            test "$(stat -c %s "$png")" -gt 100
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sprites/oga_drummyfish
          if ! git diff --cached --quiet; then
            git commit -m "art(oga): vendor original CC0 road wall and gate PNG assets"
            git push
          fi
