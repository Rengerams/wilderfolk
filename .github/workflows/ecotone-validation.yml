name: Biome ecotone premerge validation
on:
  push:
    branches:
      - feat/heightmesh-2p5d-20261028
permissions:
  contents: read
concurrency:
  group: ecotone-validation-${{ github.sha }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.12.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript build
        run: npx tsc -b
      - name: Targeted terrain and save tests
        run: npx vitest run tests/terrain.ecotones.test.ts tests/terrain.grassTextures.test.ts tests/terrain.retiredDecor.test.ts tests/terrain.saveGenerationVersion.test.ts tests/terrain.heightMesh.test.ts tests/terrain.landformGraphics.test.ts tests/terrain.presetIdentity.test.ts tests/terrain.visualCoherence.test.ts tests/terrain.naturalism.test.ts tests/terragen.riverGeneration.test.ts tests/groundLook.bands.test.ts tests/groundChunk.bands.test.ts tests/groundChunk.rebake.test.ts --maxWorkers=2
      - name: Production bundle
        run: npm run build
