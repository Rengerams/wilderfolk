name: Human needs colony calibration

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/game/**'
      - 'tests/humanNeeds*.test.ts'
      - 'scripts/run-full-year.mts'
      - '.github/workflows/human-needs-calibration.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

jobs:
  seeded-colony:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        # PR checkpoints; 150-day recovery runs weekly.
        days: [7, 30]
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 26.12.1
          cache: npm
      - run: npm ci
      - name: Run seeded food-producing colony without restocking
        run: npx tsx scripts/run-full-year.mts --scenario=producers --days=${{ matrix.days }} --seed=12345 --bot
      - name: Upload diagnostic colony logs
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: needs-colony-${{ matrix.days }}d
          path: docs/log/**
          if-no-files-found: ignore

  recovery-150-day:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 26.12.1
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify 150-day food and housing recovery
        run: npx tsx scripts/run-full-year.mts --scenario=producers --days=150 --seed=12345 --bot
      - name: Upload diagnostic colony logs
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: needs-colony-150d
          path: docs/log/**
          if-no-files-found: ignore
