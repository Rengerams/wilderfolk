name: Required calendar scheduler gate

# Fast integration contract: real gameTick around day/year boundaries, no full two-year simulation.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calendar-scheduler-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calendar-scheduler:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.4.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '26.12.1'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Real gameTick calendar boundaries, invariants and minimum owner coverage
        run: npm test -- calendar-scheduler

      - name: Non-DEV invariants through Year-2 midnight
        run: SIM_START_DAY=720 SIM_DAYS=3 npx tsx scripts/sim-invariants.ts

  producer-parity:
    if: github.event.pull_request.head.ref == 'fix/a1-calendar-restpunten-20261107'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout final A1 code
        uses: actions/checkout@v4.4.0
        with:
          path: after

      - name: Checkout pre-A1 baseline
        uses: actions/checkout@v4.4.0
        with:
          ref: 2a0acd8ac18ee5adb1393ef9b564e75cb44773f4
          path: before

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '26.12.1'
          cache: npm
          cache-dependency-path: after/package-lock.json

      - name: Install baseline dependencies
        working-directory: before
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install final dependencies
        working-directory: after
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Use identical existing producer harness for both revisions
        run: cp after/scripts/run-full-year.mts before/scripts/run-full-year.mts

      - name: Seven-day producer baseline
        working-directory: before
        run: npx tsx scripts/run-full-year.mts --scenario=producers --days=7 --bot --verbose | tee ../a1-producer-7-before.log

      - name: Seven-day producer A1
        working-directory: after
        run: npx tsx scripts/run-full-year.mts --scenario=producers --days=7 --bot --verbose | tee ../a1-producer-7-after.log

      - name: 360-day producer baseline with 30-day checkpoints
        working-directory: before
        run: npx tsx scripts/run-full-year.mts --scenario=producers --days=360 --bot --verbose | tee ../a1-producer-360-before.log

      - name: 360-day producer A1 with 30-day checkpoints
        working-directory: after
        run: npx tsx scripts/run-full-year.mts --scenario=producers --days=360 --bot --verbose | tee ../a1-producer-360-after.log

      - name: Compare working-colony food, skill and population at days 7, 30 and 360
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const read = (name, day) => {
            const lines = fs.readFileSync(name, 'utf8').split(/\r?\n/);
            return lines.filter((line) => line.startsWith('{"timestamp"'))
              .map((line) => JSON.parse(line))
              .find((item) => item.kind === 'full-year-checkpoint' && item.day === day);
          };
          for (const day of) {
            const horizon = day === 7 ? 7 : 360;
            const before = read('a1-producer-' + horizon + '-before.log', day);
            const after = read('a1-producer-' + horizon + '-after.log', day);
            if (!before || !after) throw new Error('Missing required producer checkpoint day ' + day);
            const beforeMetrics = { food: before.food, skillPoints: before.skillPoints, population: before.population.settlers };
            const afterMetrics = { food: after.food, skillPoints: after.skillPoints, population: after.population.settlers };
            const delta = Object.fromEntries(Object.keys(beforeMetrics).map((key) =>
              [key, Number((afterMetrics[key] - beforeMetrics[key]).toFixed(3))]));
            console.log(JSON.stringify({ day, before: beforeMetrics, after: afterMetrics, delta }));
          }
          NODE
