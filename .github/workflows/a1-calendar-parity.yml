name: A1 calendar 7-30-360 parity (PR #132 only)

# One-time A1 audit evidence. This compares the pre-A1 phase owner with the
# final PR using the same EXISTING invariant harness. It is NOT the waived
# 720-day continuous PR gate and does not affect any other branch.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: a1-calendar-parity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  phase-parity:
    if: github.event.pull_request.head.ref == 'fix/a1-calendar-restpunten-20261107'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout final A1 code
        uses: actions/checkout@v4.4.0
        with:
          path: after
      - name: Checkout pre-A1 baseline (parent of PR 129)
        uses: actions/checkout@v4.4.0
        with:
          ref: 2a0acd8ac18ee5adb1393ef9b564e75cb44773f4
          path: before
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '26.12.1'
          cache: npm
          cache-dependency-path: after/package-lock.json
      - name: Install pre-A1 dependencies
        working-directory: before
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install final A1 dependencies
        working-directory: after
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Instrument baseline with the identical existing invariant harness
        run: cp after/scripts/sim-invariants.ts before/scripts/sim-invariants.ts
      - name: Measure pre-A1: 360 actual continuous days, checkpoints 7/30/360
        working-directory: before
        run: SIM_DAYS=360 SIM_A1_CHECKPOINTS=1 npx tsx scripts/sim-invariants.ts | tee ../a1-before.log
      - name: Measure final A1: 360 actual continuous days, checkpoints 7/30/360
        working-directory: after
        run: SIM_DAYS=360 SIM_A1_CHECKPOINTS=1 npx tsx scripts/sim-invariants.ts | tee ../a1-after.log
      - name: Compare food, skill and population at equal elapsed days
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const read = (name) => fs.readFileSync(name, 'utf8').split(/\r?\n/)
            .filter((line) => line.startsWith('A1_SNAPSHOT '))
            .map((line) => JSON.parse(line.slice('A1_SNAPSHOT '.length)));
          const before = read('a1-before.log');
          const after = read('a1-after.log');
          for (const day of [7, 30, 360]) {
            const old = before.find((x) => x.elapsedDays === day);
            const now = after.find((x) => x.elapsedDays === day);
            if (!old || !now) throw new Error('Missing A1 checkpoint ' + day);
            const delta = (key) => Number((now[key] - old[key]).toFixed(3));
            console.log(JSON.stringify({
              days: day,
              before: { food: old.food, skillPoints: old.totalSkillPoints, population: old.population },
              after: { food: now.food, skillPoints: now.totalSkillPoints, population: now.population },
              change: {
                food: delta('food'),
                skillPoints: delta('totalSkillPoints'),
                population: delta('population'),
              },
            }));
          }
          NODE
