name: Housing 90-day targeted regression

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  housing-90-day:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4.4.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 26.12.1
          cache: npm

      - run: npm install

      - run: vitest run tests/longRunColony.integration.test.ts
