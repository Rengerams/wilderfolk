name: Population performance - medium (750)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      days:
        description: 'In-game days for manual stress test (180 = half-year)'
        required: true
        type: choice
        options: ['2', '180']
        default: '180'

permissions:
  contents: read

concurrency:
  group: perf-medium-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    uses: ./.github/workflows/perf-population-reusable.yml
    with:
      tier: medium
      population: 750
      days: ${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.days) || 2 }}
