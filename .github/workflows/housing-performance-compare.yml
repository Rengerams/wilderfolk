name: Housing performance comparison

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - base44/setup-4bdf1c9f
    paths:
      - .github/workflows/housing-performance-compare.yml
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Benchmark baseline
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach ae3532c5062c7b6b57629c9d5ab52c801dd23145
          npm ci --no-audit --no-fund
          git show "$GITHUB_SHA:scripts/benchmark-housing-pipeline.mts" > scripts/benchmark-housing-pipeline.mts
          PERF_ASSIGNMENT_DETAIL=1 PERF_POPS=600,1200,2400 PERF_SEED=12345 npx tsx scripts/benchmark-housing-pipeline.mts | tee /tmp/baseline.log
          grep '^HOUSING_PIPELINE_RESULT ' /tmp/baseline.log | sed 's/^HOUSING_PIPELINE_RESULT //' > /tmp/baseline.jsonl
      - name: Benchmark optimized
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/benchmark-housing-pipeline.mts
          git checkout --detach "$GITHUB_SHA"
          npm ci --no-audit --no-fund
          PERF_ASSIGNMENT_DETAIL=1 PERF_POPS=600,1200,2400 PERF_SEED=12345 npx tsx scripts/benchmark-housing-pipeline.mts | tee /tmp/optimized.log
          grep '^HOUSING_PIPELINE_RESULT ' /tmp/optimized.log | sed 's/^HOUSING_PIPELINE_RESULT //' > /tmp/optimized.jsonl
      - name: Compare results and assignments
        shell: bash
        run: |
          node - <<'JS'
          const fs = require('fs');
          const parse = path => fs.readFileSync(path,'utf8').trim().split('\n').map(JSON.parse);
          const old = parse('/tmp/baseline.jsonl'), fresh = parse('/tmp/optimized.jsonl');
          for (const x of fresh) {
            const y = old.find(a => a.population===x.population && a.spareHomes===x.spareHomes && a.scenario===x.scenario);
            if (!y) throw new Error('Missing baseline for '+JSON.stringify(x));
            const delta = ((x.warmMedianMs/y.warmMedianMs)-1)*100;
            console.log(JSON.stringify({population:x.population,spareHomes:x.spareHomes,scenario:x.scenario,baselineMs:y.warmMedianMs,optimizedMs:x.warmMedianMs,deltaPct:+delta.toFixed(2),sameAssignments:x.assignmentHash===y.assignmentHash,baselineMoves:y.relocations,optimizedMoves:x.relocations,baselineViolations:y.violations,optimizedViolations:x.violations}));
            if(x.assignmentHash !== y.assignmentHash) {
              const byId = new Map(y.assignments);
              const differences = x.assignments.filter(([id,home]) => byId.get(id)!==home).slice(0,20);
              console.log('HOUSING_DIFFERENCES '+JSON.stringify({population:x.population,spareHomes:x.spareHomes,scenario:x.scenario,count:x.assignments.filter(([id,home]) => byId.get(id)!==home).length,examples:differences}));
            }
            if (x.initialHash !== y.initialHash || x.violations !== 0 || y.violations !== 0) {
              console.log('FIXTURE_OR_INVARIANT_FAILURE '+JSON.stringify({population:x.population,spareHomes:x.spareHomes,scenario:x.scenario,baselineInput:y.initialHash,optimizedInput:x.initialHash,baselineViolations:y.violations,optimizedViolations:x.violations}));
              process.exitCode=1;
            } else if (x.assignmentHash !== y.assignmentHash) {
              // Skipping already-protected units before route scoring frees a limited path-search
              // budget. This may legitimately change WHICH eligible family receives an optional
              // commute improvement. Mandatory/custody/homeless outcomes must still be identical.
              const prior = new Map(y.assignments);
              const changed = x.assignments.filter(([id,home]) => prior.get(id)!==home).map(([id])=>id);
              const commuteIds = new Set([...y.moveDetails,...x.moveDetails]
                .filter(move => move.phase==='commute').flatMap(move=>move.members));
              const commuteOnly = changed.every(id=>commuteIds.has(id));
              console.log('OPTIONAL_COMMUTE_DIFFERENCE '+JSON.stringify({population:x.population,spareHomes:x.spareHomes,scenario:x.scenario,commuteOnly,changed:changed.length}));
              if (!commuteOnly || x.relocations!==y.relocations) process.exitCode=1;
            }
          }
          JS
