name: Housing performance comparison

on:
  push:
    branches:
      - base44/setup-4bdf1c9f
    paths:
      - .github/workflows/housing-performance-compare.yml
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Benchmark baseline
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach ae3532c5062c7b6b57629c9d5ab52c801dd23145
          npm ci --no-audit --no-fund
          PERF_RELOCATION=1 PERF_POPS=600,1200,2400 PERF_SEED=12345 npx tsx scripts/perf-at-pop.ts | tee /tmp/baseline.log
          grep '^RELOCATION_RESULT ' /tmp/baseline.log | sed 's/^RELOCATION_RESULT //' > /tmp/baseline.jsonl
      - name: Benchmark optimized
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$GITHUB_SHA"
          npm ci --no-audit --no-fund
          PERF_RELOCATION=1 PERF_POPS=600,1200,2400 PERF_SEED=12345 npx tsx scripts/perf-at-pop.ts | tee /tmp/optimized.log
          grep '^RELOCATION_RESULT ' /tmp/optimized.log | sed 's/^RELOCATION_RESULT //' > /tmp/optimized.jsonl
      - name: Compare results and assignments
        shell: bash
        run: |
          node - <<'JS'
          const fs = require('fs');
          const parse = path => fs.readFileSync(path,'utf8').trim().split('\n').map(JSON.parse);
          const old = parse('/tmp/baseline.jsonl'), fresh = parse('/tmp/optimized.jsonl');
          for (const x of fresh) {
            const y = old.find(a => a.population===x.population && a.spareHomes===x.spareHomes && a.reference===x.reference);
            if (!y) throw new Error('Missing baseline for '+JSON.stringify(x));
            const delta = ((x.warmMedianMs/y.warmMedianMs)-1)*100;
            console.log(JSON.stringify({population:x.population,spareHomes:x.spareHomes,baselineMs:y.warmMedianMs,optimizedMs:x.warmMedianMs,deltaPct:+delta.toFixed(2),sameAssignments:x.assignmentHash===y.assignmentHash,baselineMoved:y.moved,optimizedMoved:x.moved}));
            if(x.assignmentHash !== y.assignmentHash) process.exitCode=1;
          }
          JS
