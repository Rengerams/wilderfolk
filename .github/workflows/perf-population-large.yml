name: PR99 performance - large population (1800)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/game/**'
      - 'scripts/perf-at-pop.ts'
      - 'scripts/simCityProfile.ts'
      - 'scripts/compare-population-benchmarks.mjs'
      - '.github/workflows/perf-population-large.yml'
      - '.github/workflows/perf-population-reusable.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-large-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: github.event_name != 'pull_request' || github.event.pull_request.number == 99
    uses: ./.github/workflows/perf-population-reusable.yml
    with:
      tier: large
      population: 1800
