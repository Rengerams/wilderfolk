name: Biome terrain browser visual acceptance
on:
  push:
    branches: [feat/heightmesh-2p5d-20261028]
    paths:
      - scripts/terrain_visual_acceptance.py
      - .github/workflows/terrain-visual-qa.yml
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '26.12.1'
          cache: npm
      - name: Build actual production game
        run: npm ci --no-audit --no-fund && npm run build
      - name: Install browser harness
        run: python3 -m pip install --disable-pip-version-check --quiet playwright && python3 -m playwright install chromium
      - name: Start game and capture actual renderer output
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/wilderfolk-preview.log 2>&1 &
          for i in $(seq 1 50); do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/ >/dev/null
          python3 scripts/terrain_visual_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biome-v4-browser-screenshots
          path: docs/terrain-qa/
          if-no-files-found: warn
      - name: Commit review-sized screenshots and scene report to PR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/terrain-qa/*.jpg docs/terrain-qa/REPORT.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs(graphics): capture verified real-browser biome render previews'
            # The review branch may receive unrelated fixes during the browser job.
            # Replay this screenshot commit on the latest head instead of rejecting
            # a valid non-fast-forward push or force-overwriting the user's changes.
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
