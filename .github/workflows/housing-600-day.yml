name: 200-day housing endurance comparison

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/housing-600-day.yml
  push:
    branches:
      - base44/setup-4bdf1c9f
    paths:
      - .github/workflows/housing-600-day.yml
  workflow_dispatch:

jobs:
  real-game:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Play baseline colony for 200 days
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach ae3532c5062c7b6b57629c9d5ab52c801dd23145
          npm ci --no-audit --no-fund
          /usr/bin/time -f 'GAME_RUNTIME baseline elapsed_seconds=%e peak_kib=%M'             npx tsx scripts/run-full-year.mts --scenario=producers --days=200 --seed=12345 --bot             2>&1 | tee /tmp/game-baseline.log
      - name: Play optimized colony for 200 days
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$GITHUB_SHA"
          npm ci --no-audit --no-fund
          /usr/bin/time -f 'GAME_RUNTIME optimized elapsed_seconds=%e peak_kib=%M'             npx tsx scripts/run-full-year.mts --scenario=producers --days=200 --seed=12345 --bot             2>&1 | tee /tmp/game-optimized.log
      - name: Print comparison
        if: always()
        shell: bash
        run: |
          echo '=== BASELINE ==='
          grep -E 'GAME_RUNTIME|full-year|200 days|day 100|FAILED|failed|healthy|stalled' /tmp/game-baseline.log | tail -30 || true
          echo '=== OPTIMIZED ==='
          if [ -f /tmp/game-optimized.log ]; then
            grep -E 'GAME_RUNTIME|full-year|200 days|day 100|FAILED|failed|healthy|stalled' /tmp/game-optimized.log | tail -30 || true
          fi
