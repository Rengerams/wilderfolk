name: PR99 performance - small population (250)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/game/**'
      - 'scripts/perf-at-pop.ts'
      - 'scripts/perf-population-colony.mts'
      - 'scripts/simCityProfile.ts'
      - 'scripts/compare-population-benchmarks.mjs'
      - 'scripts/compare-population-colony.mjs'
      - '.github/workflows/perf-population-small.yml'
      - '.github/workflows/perf-population-reusable.yml'
  workflow_dispatch:
    inputs:
      days:
        description: 'In-game days for manual stress test (180 = half-year)'
        required: true
        type: choice
        options: ['2', '180']
        default: '180'

permissions:
  contents: read

concurrency:
  group: perf-small-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: github.event_name != 'pull_request' || github.event.pull_request.number == 99
    uses: ./.github/workflows/perf-population-reusable.yml
    with:
      tier: small
      population: 250
      days: ${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.days) || 2 }}
