name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build semantic-duplicate baseline
        env:
          CHECK_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -e
          
          # Vang force-pushes, nieuwe branches of de eerste commit af
          if [[ -z "$CHECK_BASE_SHA" || "$CHECK_BASE_SHA" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "$CHECK_BASE_SHA^{commit}" 2>/dev/null; then
            echo "Geen geldige base commit gevonden. Terugvallen op HEAD~1 of huidige HEAD."
            CHECK_BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi

          base_dir="$RUNNER_TEMP/wilderfolk-semantic-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          
          # Zorg voor een schone afronding bij fouten of succes
          trap 'git worktree remove --force "$base_dir" >/dev/null 2>&1 || true' EXIT
          
          # Bereid de git worktree voor
          git worktree add --detach "$base_dir" "$CHECK_BASE_SHA"
          
          # Gebruik symlink als package-lock.json gelijk is; installeer anders schoon in de worktree
          if cmp -s "$GITHUB_WORKSPACE/package-lock.json" "$base_dir/package-lock.json"; then
            ln -s "$GITHUB_WORKSPACE/node_modules" "$base_dir/node_modules"
          else
            echo "package-lock.json is gewijzigd; dependencies worden schoon geïnstalleerd voor de baseline..."
            (cd "$base_dir" && npm ci --prefer-offline --no-audit --no-fund)
          fi
          
          # Genereer de baselines in de tijdelijke worktree
          cd "$base_dir"
          node scripts/build-call-graph.mjs --json-only
          node scripts/check-semantic-duplicates.mjs --update-baseline
          node scripts/check-duplicate-code.mjs --update-baseline
          
          # Kopieer de gegenereerde baselines terug naar de workspace
          cd "$GITHUB_WORKSPACE"
          cp "$base_dir/docs/tools/semantic-duplicates-baseline.json" docs/tools/semantic-duplicates-baseline.json
          cp "$base_dir/docs/tools/duplicate-code-baseline.json" docs/tools/duplicate-code-baseline.json

      - name: Run standard checks and build on PRs and main
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            npm run test:ci -- --changed "$PR_BASE_SHA"
          else
            npm run test:ci
          fi
