[package]
name = "wilderfolk"
version = "0.6.5-1"
authors = ["Renffr"]
license = "MIT"
edition = "2024"
rust-version = "1.100.0"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] } # Geüpdatet naar moderne 1.0.x baseline
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2.4.0"
tauri-plugin-shell = "2.4.0" # Toegevoegd: essentieel voor tauri_plugin_shell::init()

# Keep dev builds debuggable — no stripping, no abort.
[profile.dev]
opt-level = 0

# Smaller/faster release binary.
[profile.release]
strip = true
panic = "abort"
codegen-units = 1
lto = true
