[package]
name = "wilderfolk"
version = "0.6.5-0"
authors = ["Renffr"]
license = "MIT"
# repository = ""  # omit until you have one
edition = "2024"
rust-version = "1.99.0" # Aangepast om compatibel te zijn met self_update v1.3.0 en editie 2026

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }


[dependencies]
serde_json = "1.0"
serde = { version = "1.0.51", features = ["derive"] }
log = "0.4.34"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2.4.0"


# Keep dev builds debuggable — no stripping, no abort.
[profile.dev]
opt-level = 0

# Smaller/faster release binary.
[profile.release]
strip = true
panic = "abort"
codegen-units = 1
lto = true
